<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Password Reset Complete - WAHOME HERD</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 12px;
            color: #166534;
            font-size: 26px;
        }

        p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        .login-button {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 25px;
            background: #166534;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
        }

        .login-button:hover {
            background: #14532d;
        }

        .footer {
            margin-top: 25px;
            color: #9ca3af;
            font-size: 12px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="icon">
            ✅
        </div>

        <h1>Password Reset Successful</h1>

        <p>
            Your WAHOME HERD password has been changed
            successfully.
        </p>

        <p style="margin-top: 10px;">
            You can now log in using your new password.
        </p>

        <a href="{% url 'login' %}" class="login-button">
            🔐 Login to WAHOME HERD
        </a>

        <div class="footer">
            WAHOME HERD • Farm Management System
        </div>

    </div>

</div>

</body>

</html>
