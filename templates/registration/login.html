<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - WAHOME HERD</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            font-size: 45px;
        }

        .brand h1 {
            margin: 10px 0 5px;
            color: #166534;
            font-size: 28px;
        }

        .brand p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #166534;
            box-shadow: 0 0 0 3px rgba(22,101,52,0.10);
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 13px;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #166534;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #14532d;
        }

        .forgot-password {
            text-align: center;
            margin-top: 16px;
        }

        .forgot-password a {
            color: #166534;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .forgot-password a:hover {
            text-decoration: underline;
            color: #14532d;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #9ca3af;
            font-size: 12px;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="brand">

            <div class="brand-icon">
                🌱
            </div>

            <h1>WAHOME HERD</h1>

            <p>Farm Management System</p>

        </div>


        {% if form.errors %}

        <div class="error">
            Invalid username or password.
            Please try again.
        </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="id_username">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="id_password">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            {% if next %}

            <input
                type="hidden"
                name="next"
                value="{{ next }}"
            >

            {% endif %}


            <button
                type="submit"
                class="login-button"
            >
                🔐 Login
            </button>

        </form>


        <div class="forgot-password">

            <a href="{% url 'password_reset' %}">
                Forgot Password?
            </a>

        </div>


        <div class="footer">
            WAHOME HERD • Farm Management System
        </div>

    </div>

</div>

</body>

</html>
