<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - WAHOME HERD</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-icon {
            font-size: 45px;
        }

        h1 {
            margin: 10px 0 5px;
            color: #166534;
            font-size: 26px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-top: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
            font-size: 14px;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #166534;
            box-shadow: 0 0 0 3px rgba(22,101,52,0.10);
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
        }

        .button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #166534;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background: #14532d;
        }

        .back {
            text-align: center;
            margin-top: 18px;
        }

        .back a {
            color: #166534;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #9ca3af;
            font-size: 12px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="brand">

            <div class="brand-icon">
                🌱
            </div>

            <h1>Forgot Password?</h1>

            <div class="subtitle">
                Enter the email address associated with your
                WAHOME HERD account and we'll send you a
                password reset link.
            </div>

        </div>


        {% if form.errors %}

        <div class="error">
            Please enter a valid email address.
        </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="id_email">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    id="id_email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                type="submit"
                class="button"
            >
                📧 Send Reset Link
            </button>

        </form>


        <div class="back">

            <a href="{% url 'login' %}">
                ← Back to Login
            </a>

        </div>


        <div class="footer">
            WAHOME HERD • Farm Management System
        </div>

    </div>

</div>

</body>

</html>
